[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.31"
# Aevum testnet runs Shanghai: no MCOPY / TSTORE / TLOAD / blob opcodes.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[lint]
# block-timestamp: FairHold deadlines are minutes to days long and are designed around block
# time. A validator's few-second timestamp drift cannot move funds to a different party; it can
# only shift *when* a pre-agreed outcome becomes available. See docs/ARCHITECTURE.md "Deadline Model".
exclude_lints = ["block-timestamp"]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
aevum = "${AEVUM_RPC_URL}"

[etherscan]
aevum = { key = "verify", chain = 44005, url = "https://explorer-test.qday.info/api/" }
